<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips - MTN MoMo Travel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/front-end/pages/styles.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-wrapper">
            <div class="nav-left">
                <a href="/home" class="logo">
                    <span class="logo-accent">MTN</span>
                    <span class="logo-momo">MoMo</span>
                    <span class="logo-sub">Travel</span>
                </a>
                <nav class="nav-links">
                    <a href="/home">Home</a>
                    <a href="/trips" class="active">My Trips</a>
                    <a href="/explore">Explore</a>
                    <a href="/bookings">Bookings</a>
                    <a href="/journeyfund">JourneyFund</a>
                </nav>
            </div>
            <div class="nav-right">
                <button class="icon-button" id="logoutBtn" aria-label="Sign out" title="Sign out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                <a href="#" class="user-profile">
                    <div class="avatar">N</div>
                    <div class="user-info"><span class="user-name">Nhlakanipho</span></div>
                </a>
            </div>
        </div>
    </header>

    <main class="page-container">
        <div class="section-title-row">
            <div>
                <h2>My Trips</h2>
                <p>Everything you've added from Explore, grouped by trip.</p>
            </div>
            <a href="/home" class="btn-primary-dark" style="background-color: var(--momo-yellow); color: var(--momo-black);">
                <i class="fa-solid fa-plus"></i> Plan a new trip
            </a>
        </div>

        <div id="tripsList" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <!-- Trip cards rendered by trips.js -->
        </div>
    </main>

    <script type="module" src="/firebase-config/firebase-config.js"></script>
    <script type="module" src="/firebase-config/firestore-service.js"></script>
    <script type="module" src="/firebase-config/auth-guard.js"></script>
    <script src="/front-end/js/cart.js" defer></script>
    <script src="/front-end/js/trips.js" defer></script>
</body>
</html>
